spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000
      keepalive-time: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:ZXZlbnRhcmFfc2VjcmV0X2tleV9tYWtlX3RoaXNfdmVyeV9sb25nX21pbl8zMl9jaGFycw==}
    expiration: ${JWT_EXPIRATION:86400000}
